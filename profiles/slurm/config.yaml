
cluster-sidecar: "slurm-sidecar.py"
cluster-cancel: "scancel"
restart-times: "0"
jobscript: "slurm-jobscript.sh"
cluster: "slurm-submit.py"
cluster-status: "slurm-status.py"
max-jobs-per-second: "10"
max-status-checks-per-second: "10"
local-cores: 1
# Shared GPFS can lag on output-file visibility after a job finishes; give it room.
latency-wait: "60"
# Each rule declares its env via `conda:` (workflow/envs/<method>.yaml); Snakemake
# activates it inside the job. Pre-build the envs once with `bash setup.sh` (which
# sets PIP_USER=0 to avoid the ~/.local torch leak). conda-prefix keeps the built
# envs in a stable, gitignored repo dir so they persist across runs.
use-conda: "True"
conda-frontend: "mamba"
conda-prefix: ".conda-envs"
use-singularity: "False"
jobs: "60"
printshellcmds: "True"
# mtime ALONE is unsafe here. A content-addressed splits DB can be swapped for one
# whose files are OLDER than the outputs they invalidate (the Aug-17 rebuild is
# dated Aug 14; the stale logits it invalidates were written Aug 22), so an
# mtime-only comparison declares the old results up to date and the run silently
# keeps them -- mixing previous-DB and current-DB logits in one metrics table.
# `input` catches the changed input-file set, `params` catches config changes.
# `code`/`software-env` are deliberately NOT included: this repo edits rule bodies
# constantly and those would trigger mass reruns on cosmetic changes.
rerun-triggers: ["mtime", "params", "input"]

