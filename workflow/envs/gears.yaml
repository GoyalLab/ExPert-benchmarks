# Conda spec for the gears rule (GNN perturbation model, GPU). Mirrors the
# vendored GEARS/requirements.txt; torch/torch_geometric are unpinned upstream so
# we pin a CUDA build proven on the cluster's A100s (2.5.1+cu124, same as
# scgpt/scouter) plus a compatible PyG. The in-tree `gears` package is put on
# PYTHONPATH by the rule (run_GEARS.py also self-locates it), so no pip install.
name: gears
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch==2.5.1
      - torch_geometric==2.6.1
      - numpy==1.26.4
      - pandas==2.2.2
      - scikit-learn==1.5.1
      - scanpy==1.10.2
      - networkx==3.3
      - scipy==1.14.1
      - dcor
      - tqdm==4.66.5
      - requests
