# Conda spec for the cellot rules (optimal-transport perturbation models). cellot
# is CPU-only. Mirrors the legacy requirements.txt minus the
# dev-only tools (jupyterlab, ipython, sphinx). The in-tree `cellot` package is
# NOT pip-installed — the rules put it on PYTHONPATH (like scgpt's vendored pkg),
# which is equivalent to the legacy `python setup.py develop`.
name: cellot
channels:
  - conda-forge
dependencies:
  - python=3.9.5
  - pip
  - pip:
      - setuptools==49.6.0
      - numpy==1.19.5
      - matplotlib==3.3.3
      - scanpy==1.8.1
      - anndata==0.9.2
      - ml-collections==0.1.0
      - pandas==1.2.5
      - scipy==1.8.1
      - scikit-learn==1.1.1
      - seaborn==0.11.1
      - torch==1.11.0
